name: Bug / Bug report
description: Quelque chose ne marche pas comme prévu · Something in the app isn't working as expected
labels: ["bug", "needs-repro"]
body:
  - type: markdown
    attributes:
      value: |
        Merci ! Un rappel avant de commencer : les tickets sont **publics**. Pas de nom d'élève, de photo de leçon avec un nom, de mot de passe ni d'autre donnée personnelle.

        Thanks for the report! One reminder: issues here are **public**. Please don't include a pupil's name, a photo of a lesson with a name on it, passwords, or any other personal data.
  - type: input
    id: app-version
    attributes:
      label: Version de l'application · App version
      description: En bas de « Mon profil » · At the bottom of "Mon profil".
      placeholder: e.g. 1.4.2 (12)
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Plateforme · Platform
      options:
        - Android
        - iOS
        - Web (yoyocards.fr)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Appareil et version du système · Device and OS version
      placeholder: e.g. Pixel 8, Android 15
  - type: textarea
    id: what-happened
    attributes:
      label: Que s'est-il passé ? · What happened?
      description: Ce que vous avez vu, et ce que vous attendiez à la place · What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro-steps
    attributes:
      label: Étapes pour reproduire · Steps to reproduce
      placeholder: |
        1. Ouvrir …
        2. Appuyer sur …
        3. Voir …
    validations:
      required: true
